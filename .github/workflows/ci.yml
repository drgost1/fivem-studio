name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit signatures
      - run: npm run prepare:luals
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run dist
      - run: npm run verify:package
      - uses: actions/upload-artifact@v7
        with:
          name: qb-studio-unsigned-${{ github.sha }}
          path: release/QB-Studio-Setup-*.exe
          if-no-files-found: error
          retention-days: 7
