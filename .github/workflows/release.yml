name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  attestations: write
  id-token: write
  artifact-metadata: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit signatures
      - run: npm run prepare:luals
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest installer provenance
        if: ${{ hashFiles('release/QB-Studio-Setup-*.exe') != '' }}
        uses: actions/attest@v4
        with:
          subject-path: release/QB-Studio-Setup-*.exe
      - name: Attest installer SBOM
        if: ${{ hashFiles('release/QB-Studio-Setup-*.exe') != '' && hashFiles('release/bom.cdx.json') != '' }}
        uses: actions/attest@v4
        with:
          subject-path: release/QB-Studio-Setup-*.exe
          sbom-path: release/bom.cdx.json
